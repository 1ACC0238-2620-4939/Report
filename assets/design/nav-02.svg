<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F7F9FC"/><text x="60" y="80" font-size="40">NAV-02 | Navegación del supervisor</text><rect x="60" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="215" font-family="Arial" font-size="26">Entrada operativa</text><text x="82" y="251" font-family="Arial" font-size="20">Dashboard → viajes</text><text x="82" y="287" font-family="Arial" font-size="20">Listado → detalle de viaje</text><text x="82" y="323" font-family="Arial" font-size="20">Detalle → seguimiento</text><text x="82" y="359" font-family="Arial" font-size="20">Volver → listado</text><rect x="570" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="215" font-family="Arial" font-size="26">Recursos</text><text x="592" y="251" font-family="Arial" font-size="20">Flota → vehículos</text><text x="592" y="287" font-family="Arial" font-size="20">Flota → conductores</text><text x="592" y="323" font-family="Arial" font-size="20">Seleccionar → detalle</text><text x="592" y="359" font-family="Arial" font-size="20">Asignación real requiere API</text><rect x="1080" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="1102" y="215" font-family="Arial" font-size="26">Gestión de operación</text><text x="1102" y="251" font-family="Arial" font-size="20">Viaje → eventos / incidencias</text><text x="1102" y="287" font-family="Arial" font-size="20">Confirmar cambios de estado</text><text x="1102" y="323" font-family="Arial" font-size="20">Historial → filtros → detalle</text><text x="1102" y="359" font-family="Arial" font-size="20">Diseño: integración pendiente</text></svg>