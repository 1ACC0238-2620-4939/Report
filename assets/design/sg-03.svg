<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F7F9FC"/><text x="60" y="80" font-size="40">SG-03 | Componentes y estados</text><rect x="60" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="215" font-family="Arial" font-size="26">Acciones</text><text x="82" y="251" font-family="Arial" font-size="20">Primaria: guardar / confirmar</text><text x="82" y="287" font-family="Arial" font-size="20">Secundaria: cancelar / volver</text><text x="82" y="323" font-family="Arial" font-size="20">Disabled: acción indisponible</text><text x="82" y="359" font-family="Arial" font-size="20">Loading: evitar envíos duplicados</text><rect x="570" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="215" font-family="Arial" font-size="26">Formularios</text><text x="592" y="251" font-family="Arial" font-size="20">Label persistente y ayuda</text><text x="592" y="287" font-family="Arial" font-size="20">Normal / focus / error</text><text x="592" y="323" font-family="Arial" font-size="20">Error junto al campo</text><text x="592" y="359" font-family="Arial" font-size="20">Conservar los datos ingresados</text><rect x="1080" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="1102" y="215" font-family="Arial" font-size="26">Listas y cards</text><text x="1102" y="251" font-family="Arial" font-size="20">Título, estado y detalle</text><text x="1102" y="287" font-family="Arial" font-size="20">Acceso al recurso seleccionado</text><text x="1102" y="323" font-family="Arial" font-size="20">Empty: explicar ausencia</text><text x="1102" y="359" font-family="Arial" font-size="20">Error: permitir reintentar</text><rect x="60" y="520" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="565" font-family="Arial" font-size="26">Estados operativos</text><text x="82" y="601" font-family="Arial" font-size=