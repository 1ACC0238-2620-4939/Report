<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F7F9FC"/><text x="60" y="80" font-size="40">NAV-01 | Navegación del landing</text><rect x="60" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="215" font-family="Arial" font-size="26">Inicio y exploración</text><text x="82" y="251" font-family="Arial" font-size="20">Header → anclas de sección</text><text x="82" y="287" font-family="Arial" font-size="20">Hero → funcionalidades</text><text x="82" y="323" font-family="Arial" font-size="20">CTA → formulario / contacto</text><text x="82" y="359" font-family="Arial" font-size="20">Scroll conserva jerarquía</text><rect x="570" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="215" font-family="Arial" font-size="26">Retorno y adaptación</text><text x="592" y="251" font-family="Arial" font-size="20">Marca → inicio</text><text x="592" y="287" font-family="Arial" font-size="20">Menú responsive</text><text x="592" y="323" font-family="Arial" font-size="20">Teclado y foco visibles</text><text x="592" y="359" font-family="Arial" font-size="20">Enlaces con propósito claro</text><rect x="1080" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="1102" y="215" font-family="Arial" font-size="26">Salida</text><text x="1102" y="251" font-family="Arial" font-size="20">Footer → términos / contacto</text><text x="1102" y="287" font-family="Arial" font-size="20">Enlaces externos identificables</text><text x="1102" y="323" font-family="Arial" font-size="20">Demo → información de producto</text><text x="1102" y="359" font-family="Arial" font-size="20">No presentar prototipo como API</text></svg>