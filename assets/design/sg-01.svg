<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F7F9FC"/><text x="60" y="80" font-size="40">SG-01 | Branding y uso de marca</text><rect x="60" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="215" font-family="Arial" font-size="26">Nombre del producto</text><text x="82" y="251" font-family="Arial" font-size="20">Trakto Route</text><text x="82" y="287" font-family="Arial" font-size="20">Gestión y trazabilidad de carga</text><text x="82" y="323" font-family="Arial" font-size="20">Conservar la denominación</text><text x="82" y="359" font-family="Arial" font-size="20">No abreviar en títulos de producto</text><rect x="570" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="215" font-family="Arial" font-size="26">Superficies claras</text><text x="592" y="251" font-family="Arial" font-size="20">Usar el logo actual de la landing</text><text x="592" y="287" font-family="Arial" font-size="20">Fondo blanco o neutro</text><text x="592" y="323" font-family="Arial" font-size="20">Área libre de otros elementos</text><text x="592" y="359" font-family="Arial" font-size="20">No deformar ni recolorear</text><rect x="1080" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="1102" y="215" font-family="Arial" font-size="26">Superficies oscuras</text><text x="1102" y="251" font-family="Arial" font-size="20">Ubicar logo en superficie clara</text><text x="1102" y="287" font-family="Arial" font-size="20">Mantener proporciones</text><text x="1102" y="323" font-family="Arial" font-size="20">Contraste legible</text><text x="1102" y="359" font-family="Arial" font-size="20">No superponer sobre fotografías</text><rect x="60" y="520" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="565" font-family="Arial" font-size="26">Comunicación</text><text x="82" y="601" font-family="Arial" font-size="20">Serio y profesional</text><text x="82" y="637" font-family="Arial" font-size="20">Respetuoso y sereno</text><text x="82" y="673" font-family="Arial" font-size="20">Describir estado y siguiente acción</text><text x="82" y="709" font-family="Arial" font-size="20">Confirmar cambios de impacto</text><rect x="570" y="520" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="565" font-family="Arial" font-size="26">Aplicación</text><text x="592" y="601" font-family="Arial" font-size="20">Landing: propuesta y contacto</text><text x="592" y="637" font-family="Arial" font-size="20">Mobile: navegación y acciones</text><text x="592" y="673" font-family="Arial" font-size="20">Informe: figuras y encabezados</text><text x="592" y="709" font-family="Arial" font-size="20">La marca no acredita validación</text></svg>