<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F7F9FC"/><text x="60" y="80" font-size="40">NAV-03 | Navegación del cliente</text><rect x="60" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="82" y="215" font-family="Arial" font-size="26">Entrada</text><text x="82" y="251" font-family="Arial" font-size="20">Mis envíos → envío seleccionado</text><text x="82" y="287" font-family="Arial" font-size="20">Detalle → progreso y ruta</text><text x="82" y="323" font-family="Arial" font-size="20">Actualizar → último estado</text><text x="82" y="359" font-family="Arial" font-size="20">Volver → mis envíos</text><rect x="570" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="592" y="215" font-family="Arial" font-size="26">Consulta contextual</text><text x="592" y="251" font-family="Arial" font-size="20">Envío → eventos</text><text x="592" y="287" font-family="Arial" font-size="20">Evento → detalle</text><text x="592" y="323" font-family="Arial" font-size="20">Historial → operación anterior</text><text x="592" y="359" font-family="Arial" font-size="20">Filtros conservan contexto</text><rect x="1080" y="170" width="475" height="315" rx="18" fill="white" stroke="#155EEF"/><text x="1102" y="215" font-family="Arial" font-size="26">Acceso y errores</text><text x="1102" y="251" font-family="Arial" font-size="20">Solo operaciones autorizadas</text><text x="1102" y="287" font-family="Arial" font-size="20">Sesión expirada → login</text><text x="1102" y="323" font-family="Arial" font-size="20">Sin resultados → limpiar filtros</text><text x="1102" y="359" font-family="Arial" font-size="20">Diseño: IAM todavía pendiente</text></svg>