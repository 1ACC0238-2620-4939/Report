<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trakto Route - Prototipo móvil</title>
<style>
:root{--navy:#123b5d;--blue:#1676b8;--cyan:#1ba7c9;--green:#1e9d72;--red:#d65757;--ink:#183142;--muted:#607484;--bg:#eaf1f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.45 Segoe UI,Arial;color:var(--ink);display:grid;min-height:100vh;place-items:center}
.shell{width:min(430px,100vw);min-height:820px;background:#f7fafb;box-shadow:0 22px 70px #123b5d35;position:relative;overflow:hidden}.top{background:var(--navy);color:white;padding:28px 24px 22px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:#cfe2f0}.page{padding:22px 20px 105px}.card{background:white;border:1px solid #d8e3ea;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 5px 16px #123b5d10}.card h3{margin:0 0 5px}.muted{color:var(--muted)}button,.button{border:0;border-radius:14px;padding:14px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer;width:100%;margin-top:10px}button.secondary{background:#eaf5fb;color:var(--navy)}input,select,textarea{width:100%;padding:13px;border:1px solid #b7c7d3;border-radius:12px;margin:6px 0 12px;font:inherit}.nav{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid #d8e3ea;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 4px 14px}.nav button{background:white;color:var(--muted);padding:8px 2px;margin:0;font-size:12px}.nav button.active{color:var(--blue)}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#e8f7f1;color:#137958;font-weight:700;font-size:13px}.alert{background:#fff2f2;border-left:5px solid var(--red);padding:12px;border-radius:10px}.progress{height:10px;background:#dae5eb;border-radius:99px;overflow:hidden}.progress span{display:block;width:62%;height:100%;background:var(--green)}.hidden{display:none!important}
</style></head><body><main class="shell"><header class="top"><h1 id="title">Trakto Route</h1><p id="subtitle">Prototipo interactivo</p></header><section class="page" id="page"></section><nav class="nav hidden" id="nav"><button data-view="trips">Viajes</button><button data-view="tracking">Seguimiento</button><button data-view="fleet">Flota</button><button data-view="profile">Perfil</button></nav></main>
<script>
const page=document.querySelector('#page'),nav=document.querySelector('#nav'),title=document.querySelector('#title'),subtitle=document.querySelector('#subtitle');
const views={
 login:()=>`<div class="card"><h3>Iniciar sesión</h3><p class="muted">Seleccione un rol para recorrer los flujos autorizados.</p><label>Rol</label><select id="role"><option>Supervisor de flota</option><option>Cliente de transporte</option></select><label>Correo</label><input value="carlos@trakto.pe"><label>Contraseña</label><input type="password" value="demo1234"><button data-go="trips">Ingresar al prototipo</button></div>`,
 trips:()=>`<div class="card"><h3>Mis viajes</h3><input placeholder="Código, origen o destino"><select><option>Todos los estados</option><option>Programado</option><option>En curso</option><option>Finalizado</option></select><button class="secondary" data-go="newtrip">Programar viaje</button></div><div class="card"><span class="pill">En curso</span><h3>TR-1048 · Lima → Callao</h3><p class="muted">Entrega estimada 16:30</p><button data-go="detail">Ver detalle</button></div><div class="card"><span class="pill">Programado</span><h3>TR-1052 · Ate → Chorrillos</h3><p class="muted">Salida 07/10 · 08:00</p></div>`,
 detail:()=>`<div class="card"><span class="pill">En curso</span><h3>Viaje TR-1048</h3><p>Ruta Norte · VAN-204 · Carlos Ruiz</p><div class="progress"><span></span></div><p class="muted">3 de 5 hitos completados</p><button data-go="tracking">Abrir seguimiento</button><button class="secondary" data-go="incident">Registrar incidencia</button></div><button class="secondary" data-go="trips">Volver a viajes</button>`,
 tracking:()=>`<div class="card"><h3>Seguimiento TR-1048</h3><p class="muted">Última actualización 14:26</p><div class="progress"><span></span></div><h3>Av. Faucett, Callao</h3><p>En ruta · sin retrasos</p></div><div class="card"><h3>Eventos</h3><p>12:10 · Inicio del viaje</p><p>13:42 · Control de ruta</p><button data-go="history">Ver historial</button></div>`,
 fleet:()=>`<div class="card"><h3>Flota disponible</h3><input placeholder="Placa, nombre o licencia"><p><b>Vehículos:</b> 12 activos · 2 en mantenimiento</p><p><b>Conductores:</b> 8 disponibles · 4 asignados</p></div><div class="card"><h3>VAN-204</h3><p class="muted">Operativo · asignado a TR-1048</p><button class="secondary">Consultar detalle</button></div>`,
 profile:()=>`<div class="card"><h3>Carlos Mendoza</h3><p class="muted">Supervisor de flota</p><p><b>Notificaciones:</b> eventos críticos y cambios de estado</p><button class="secondary" data-go="login">Cerrar sesión</button></div>`,
 newtrip:()=>`<div class="card"><h3>Programar viaje</h3><label>Origen</label><input value="Lima"><label>Destino</label><input value="Callao"><label>Fecha</label><input type="date" value="2026-10-07"><label>Recursos</label><select><option>Ruta Norte · VAN-210 · A. Vega</option></select><button data-go="confirmed">Revisar y confirmar</button></div>`,
 confirmed:()=>`<div class="card"><span class="pill">Programado</span><h3>Viaje creado</h3><p>La operación TR-1058 fue registrada y los recursos quedaron reservados.</p><button data-go="trips">Volver a viajes</button></div>`,
 incident:()=>`<div class="card"><h3>Nueva incidencia</h3><select><option>Retraso operativo</option><option>Evento de ruta</option></select><textarea rows="4" placeholder="Describa el hecho observado"></textarea><button data-go="incidentdone">Registrar incidencia</button><button class="secondary" data-go="detail">Cancelar</button></div>`,
 incidentdone:()=>`<div class="card"><div class="alert"><b>Incidencia registrada</b><br>Se notificó al equipo responsable y el viaje conserva su trazabilidad.</div><button data-go="detail">Volver al viaje</button></div>`,
 history:()=>`<div class="card"><h3>Historial autorizado</h3><select><option>Últimos 30 días</option><option>Últimos 90 días</option></select><p><b>TR-1031</b> · Entregado · 29/09</p><p><b>TR-1024</b> · Entregado · 21/09</p><button data-go="tracking">Volver a eventos</button></div>`};
function render(name){page.innerHTML=views[name]();nav.classList.toggle('hidden',name==='login');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));subtitle.textContent=name==='login'?'Prototipo interactivo':'Navegación por rol y contexto';}
document.addEventListener('click',e=>{const go=e.target.dataset.go||e.target.dataset.view;if(go)render(go)});render('login');
</script></body></html>
